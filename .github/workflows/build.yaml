name: Build BigSurface
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Kext
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Dependencies Structure
        run: |
          # 1. Fix VoodooGPIO (Calea: Dependencies/VoodooGPIO/VoodooGPIO/VoodooGPIO.hpp)
          mkdir -p Dependencies/VoodooGPIO/VoodooGPIO
          cp Dependencies/VoodooGPIO/VoodooGPIO.hpp Dependencies/VoodooGPIO/VoodooGPIO/VoodooGPIO.hpp || true
          
          # 2. Fix VoodooSMBus (Case Sensitivity & Path)
          mkdir -p Dependencies/VoodooSMBus
          cp Dependencies/voodoosmbus/*.hpp Dependencies/VoodooSMBus/ || true

          # 3. Fix VoodooSerial (Calea: Dependencies/VoodooSerial/VoodooSerial/VoodooUART/...)
          # Codul caută un folder VoodooSerial în interiorul folderului VoodooSerial
          mkdir -p Dependencies/VoodooSerial/VoodooSerial/VoodooUART
          cp Dependencies/VoodooSerial/VoodooUART/*.hpp Dependencies/VoodooSerial/VoodooSerial/VoodooUART/ || true
          
          # 4. Verificare MacKernel
          if [ -d "MacKernel/Headers" ]; then
            echo "MacKernel Headers găsite."
          fi

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Kext
        run: |
          cd BigSurface
          xcodebuild -project BigSurface.xcodeproj \
                     -scheme BigSurface \
                     -configuration Release \
                     -arch x86_64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build \
                     HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/MacKernel/Headers" "${GITHUB_WORKSPACE}/Dependencies" "${GITHUB_WORKSPACE}/Dependencies/Lilu" "${GITHUB_WORKSPACE}/Dependencies/VoodooSMBus" "${GITHUB_WORKSPACE}/Dependencies/VoodooGPIO" "${GITHUB_WORKSPACE}/Dependencies/VoodooSerial" "${GITHUB_WORKSPACE}/Dependencies/VoodooSerial/VoodooSerial"' \
                     USER_HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/MacKernel/Headers" "${GITHUB_WORKSPACE}/Dependencies" "${GITHUB_WORKSPACE}/Dependencies/Lilu" "${GITHUB_WORKSPACE}/Dependencies/VoodooSMBus" "${GITHUB_WORKSPACE}/Dependencies/VoodooGPIO" "${GITHUB_WORKSPACE}/Dependencies/VoodooSerial" "${GITHUB_WORKSPACE}/Dependencies/VoodooSerial/VoodooSerial"'
