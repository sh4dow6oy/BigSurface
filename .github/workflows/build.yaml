name: Build BigSurface
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Kext
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          # Descărcăm headerele necesare pentru VoodooSerial și Lilu
          git clone https://github.com/VoodooI2C/VoodooSerial.git VoodooSerial
          git clone https://github.com/acidanthera/Lilu.git Lilu
          
          # Creăm simlink-uri pentru ca proiectul să le găsească unde se așteaptă
          # Ajustează aceste căi în funcție de unde se află fișierele tale sursă
          mkdir -p BigSurface/include
          cp -R VoodooSerial/*.hpp BigSurface/SurfaceSerialHub/ 2>/dev/null || true

      - name: Build Kext
        run: |
          xcodebuild -project BigSurface/BigSurface.xcodeproj \
                     -scheme BigSurface \
                     -configuration Release \
                     ARCHS="x86_64" \
                     CODE_SIGNING_ALLOWED=NO \
                     ADDITIONAL_HEADER_SEARCH_PATHS="$GITHUB_WORKSPACE/VoodooSerial $GITHUB_WORKSPACE/Lilu"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigSurface-Kext-SL4
          path: BigSurface/build/Release/BigSurface.kext
