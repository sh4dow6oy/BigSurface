name: Build BigSurface
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Kext
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Xcode
        # Folosim versiunea de Xcode instalată implicit pe mașina virtuală macOS
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Kext
        run: |
          # Curăță și compilează proiectul în configurația Release
          # Dezactivăm semnarea codului (Code Signing) pentru a permite compilarea pe GitHub
          xcodebuild -project BigSurface.xcodeproj -scheme BigSurface -configuration Release-x86_64_arm64 ARCHS="x86_64" CODE_SIGNING_ALLOWED=NO

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigSurface-Kext-SL4
          path: build/Release/BigSurface.kext
