name: Build BigSurface
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Kext
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Dependencies
        run: |
          # 1. Descarcă Lilu pentru headere
          curl -L -o Lilu.zip https://github.com/acidanthera/Lilu/releases/download/1.7.1/Lilu-1.7.1-RELEASE.zip
          unzip Lilu.zip -d Lilu_Archive
          
          # 2. Creează folderele pe care codul tău le așteaptă
          mkdir -p BigSurface/Dependencies/VoodooGPIO/VoodooGPIO
          mkdir -p BigSurface/BigSurface/Headers # Pentru Lilu
          
          # 3. Copiază fișierele din repository-ul tău în locațiile așteptate de cod (fix pentru ../../../)
          # Presupunem că fișierele sunt în folderul 'Dependencies' din rădăcină
          cp Dependencies/VoodooSerial.kext/Contents/Headers/*.hpp BigSurface/Dependencies/ 2>/dev/null || true
          
          # Rezolvăm eroarea VoodooGPIO.hpp
          # Dacă ai folderul VoodooGPIO în Dependencies, îl copiem unde îl caută codul:
          cp -R Dependencies/VoodooGPIO/* BigSurface/Dependencies/VoodooGPIO/VoodooGPIO/ 2>/dev/null || true
          # Dacă nu ai folderul, creăm un fișier gol sau simlink pentru a nu bloca build-ul (dacă nu e critic)
          touch BigSurface/Dependencies/VoodooGPIO/VoodooGPIO/VoodooGPIO.hpp

          # 4. Rezolvăm eroarea <Headers/kern_util.hpp>
          cp Lilu_Archive/Lilu.kext/Contents/Headers/*.hpp BigSurface/BigSurface/Headers/ || true

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Kext
        run: |
          # Injectăm căile de search pentru a acoperi toate variantele de #include
          xcodebuild -project BigSurface/BigSurface.xcodeproj \
                     -scheme BigSurface \
                     -configuration Release \
                     -arch x86_64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build \
                     HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/Lilu_Archive/Lilu.kext/Contents/Headers" "${GITHUB_WORKSPACE}/Dependencies" "${GITHUB_WORKSPACE}/BigSurface/BigSurface"' \
                     USER_HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/Lilu_Archive/Lilu.kext/Contents/Headers" "${GITHUB_WORKSPACE}/Dependencies"'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigSurface-Kext-SL4-AMD
          path: build/BigSurface.kext
