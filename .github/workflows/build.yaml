name: Build BigSurface
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Kext
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Dependencies Structure
        run: |
          # 1. Rezolvăm VoodooGPIO: codul caută ../../../Dependencies/VoodooGPIO/VoodooGPIO/VoodooGPIO.hpp
          mkdir -p Dependencies/VoodooGPIO/VoodooGPIO
          cp Dependencies/VoodooGPIO/VoodooGPIO.hpp Dependencies/VoodooGPIO/VoodooGPIO/VoodooGPIO.hpp || true
          
          # 2. Rezolvăm VoodooSMBus (Case Sensitivity & Path)
          # Codul include "VoodooSMBus/VoodooSMBusDevice.hpp"
          # Creăm un folder 'VoodooSMBus' în interiorul folderului 'Dependencies'
          mkdir -p Dependencies/VoodooSMBus
          # Copiem fișierele din folderul tău cu litere mici 'voodoosmbus' în cel cu litere mari
          cp Dependencies/voodoosmbus/*.hpp Dependencies/VoodooSMBus/ || true
          
          # 3. Rezolvăm Lilu: codul include <Headers/kern_util.hpp>
          # Search path-ul va fi setat pe Dependencies/Lilu, unde se află folderul Headers.

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Kext
        run: |
          cd BigSurface
          xcodebuild -project BigSurface.xcodeproj \
                     -scheme BigSurface \
                     -configuration Release \
                     -arch x86_64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build \
                     HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/Dependencies" "${GITHUB_WORKSPACE}/Dependencies/Lilu" "${GITHUB_WORKSPACE}/Dependencies/VoodooSMBus" "${GITHUB_WORKSPACE}/Dependencies/VoodooGPIO"' \
                     USER_HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/Dependencies" "${GITHUB_WORKSPACE}/Dependencies/Lilu" "${GITHUB_WORKSPACE}/Dependencies/VoodooSMBus" "${GITHUB_WORKSPACE}/Dependencies/VoodooGPIO"'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigSurface-Kext-SL4-AMD
          path: build/BigSurface.kext
