name: Build BigSurface
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Kext
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Dependencies
        run: |
          # 1. Descarcă Lilu 1.7.1 pentru headerele de baterie
          curl -L -o Lilu.zip https://github.com/acidanthera/Lilu/releases/download/1.7.1/Lilu-1.7.1-RELEASE.zip
          unzip Lilu.zip -d Lilu_Archive
          
          # 2. Creează structura cerută de eroare: ../../../Dependencies/VoodooGPIO/VoodooGPIO/VoodooGPIO.hpp
          # Codul execută xcodebuild în BigSurface/BigSurface.xcodeproj, deci are nevoie de Dependencies în rădăcină
          mkdir -p Dependencies/VoodooGPIO/VoodooGPIO
          
          # 3. Copiază VoodooGPIO.hpp (pe care îl ai în repo la Dependencies/VoodooGPIO.hpp) în locul cerut de compilator
          cp Dependencies/VoodooGPIO.hpp Dependencies/VoodooGPIO/VoodooGPIO/VoodooGPIO.hpp || true
          
          # 4. Pregătește Lilu pentru eroarea 'Headers/kern_util.hpp'
          # Codul caută #include <Headers/kern_util.hpp>
          mkdir -p BigSurface/BigSurface/Headers
          cp Lilu_Archive/Lilu.kext/Contents/Headers/*.hpp BigSurface/BigSurface/Headers/ || true

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Kext
        run: |
          # Rulăm build-ul din folderul corect
          cd BigSurface
          xcodebuild -project BigSurface.xcodeproj \
                     -scheme BigSurface \
                     -configuration Release \
                     -arch x86_64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build \
                     HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/Lilu_Archive/Lilu.kext/Contents/Headers" "${GITHUB_WORKSPACE}/Dependencies"' \
                     USER_HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/Lilu_Archive/Lilu.kext/Contents/Headers" "${GITHUB_WORKSPACE}/Dependencies"'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigSurface-Kext-SL4-AMD
          path: build/BigSurface.kext
