name: Build BigSurface
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Kext
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Dependencies Structure
        run: |
          # 1. Creăm ierarhia cerută de căile relative din cod (../../../)
          # Codul caută: Dependencies/VoodooGPIO/VoodooGPIO/VoodooGPIO.hpp
          mkdir -p Dependencies/VoodooGPIO/VoodooGPIO
          cp Dependencies/VoodooGPIO/VoodooGPIO.hpp Dependencies/VoodooGPIO/VoodooGPIO/VoodooGPIO.hpp || true
          
          # 2. Creăm o scurtătură (simlink) pentru Lilu pentru a satisface <Headers/kern_util.hpp>
          # Codul caută un folder numit 'Headers' în interiorul căii de search
          # Structura ta este deja Dependencies/Lilu/Headers, deci vom adăuga Dependencies/Lilu în search paths.

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Kext
        run: |
          cd BigSurface
          xcodebuild -project BigSurface.xcodeproj \
                     -scheme BigSurface \
                     -configuration Release \
                     -arch x86_64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build \
                     HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/Dependencies" "${GITHUB_WORKSPACE}/Dependencies/Lilu" "${GITHUB_WORKSPACE}/Dependencies/VoodooGPIO" "${GITHUB_WORKSPACE}/Dependencies/VoodooSMBus"' \
                     USER_HEADER_SEARCH_PATHS='$(inherited) "${GITHUB_WORKSPACE}/Dependencies" "${GITHUB_WORKSPACE}/Dependencies/Lilu" "${GITHUB_WORKSPACE}/Dependencies/VoodooGPIO" "${GITHUB_WORKSPACE}/Dependencies/VoodooSMBus"'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigSurface-Kext-SL4-AMD
          path: build/BigSurface.kext
